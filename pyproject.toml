[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "practipy"
version = "0.0.1"
description = "A Python package for physics calculations"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
